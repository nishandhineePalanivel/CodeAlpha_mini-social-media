<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MiniSocial</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="auth-layout">
    <div class="auth-visual">
      <div>
        <h1>MiniSocial</h1>
        <p>Connect with friends and the world around you.</p>
      </div>
    </div>
    <div class="auth-form-container">
      <div class="auth-card">
        <h1 class="auth-logo-mobile">MiniSocial</h1>
        <h2 class="mb-2 text-center">Welcome back</h2>
        <div id="login-message" class="hidden" style="color:var(--error-color); margin-bottom:15px; text-align:center;"></div>
        <form id="login-form">
          <div class="form-group mb-1">
            <input type="email" id="email" class="form-control" placeholder="Email address" required>
          </div>
          <div class="form-group mb-2">
            <input type="password" id="password" class="form-control" placeholder="Password" required>
          </div>
          <button type="submit" class="btn">Log In</button>
        </form>
        <div class="text-center mt-2">
          <span class="text-secondary">Don't have an account?</span> 
          <a href="register.html" style="color:var(--primary-color); font-weight:600;">Sign up</a>
        </div>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
