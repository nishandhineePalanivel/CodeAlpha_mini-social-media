<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - MiniSocial</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="mobile-top-nav">
    <div class="mobile-logo">MiniSocial</div>
    <div onclick="toggleTheme()" style="cursor:pointer; font-size:1.2rem;"><i class="fa-solid fa-moon"></i></div>
  </div>

  <div class="app-layout">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <i class="fa-brands fa-instagram"></i> MiniSocial
      </div>
      <div class="nav-menu">
        <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> <span>Home</span></a>
        <a href="search.html" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i> <span>Search</span></a>
        <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i> <span>Profile</span></a>
        <div class="nav-item" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i> <span>Theme</span></div>
        <a href="#" id="logout-btn" class="nav-item" style="margin-top:auto;"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span>Logout</span></a>
      </div>
    </nav>

    <main class="main-content">
      <div id="profile-container">
        <!-- Profile loaded here -->
        <div class="skeleton-header" style="padding:40px 0;">
          <div class="skeleton skeleton-avatar" style="width:150px; height:150px;"></div>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <div class="skeleton skeleton-text" style="width:200px; height:24px;"></div>
            <div class="skeleton skeleton-text" style="width:150px;"></div>
          </div>
        </div>
      </div>

      <!-- Edit Form Modal/Card -->
      <div id="edit-profile-form-container" class="card hidden">
        <h3>Edit Profile</h3>
        <form id="edit-profile-form" class="mt-1">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="edit-name" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Bio</label>
            <textarea id="edit-bio" class="form-control" rows="3"></textarea>
          </div>
          <div style="display:flex; gap:10px;">
            <button type="submit" class="btn">Save</button>
            <button type="button" class="btn btn-outline" id="cancel-edit-btn">Cancel</button>
          </div>
        </form>
      </div>

      <h3 style="border-bottom:1px solid var(--border-color); padding-bottom:15px; margin-bottom:20px; text-align:center;">POSTS</h3>
      <div id="user-posts-container">
        <div class="skeleton-post"><div class="skeleton-header"><div class="skeleton skeleton-avatar"></div><div class="skeleton skeleton-text"></div></div><div class="skeleton skeleton-content"></div></div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/post.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
