<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed - Mini Social Media</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">MiniSocial</div>
      <div class="nav-links" id="nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="search.html">Search</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logout-btn">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h3>Create Post</h3>
      <form id="create-post-form" class="mt-1">
        <div class="form-group">
          <textarea id="post-content" class="form-control" rows="3" placeholder="What's on your mind?" required></textarea>
        </div>
        <button type="submit" class="btn">Post</button>
      </form>
      <div id="post-message" class="mt-1 hidden"></div>
    </div>

    <div id="feed-container">
      <div class="text-center">Loading posts...</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
